# Tells Spring to automatically map both producers and consumers to the dynamic cluster connection string
#spring.kafka.bootstrap-servers=${spring.kafka.bootstrap-servers:localhost:9092}
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}

# Deserialization configurations so listeners know how to interpret our objects
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Crucial: Instruct the JSON deserializer to trust our application packages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo
